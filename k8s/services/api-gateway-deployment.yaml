apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cnpm-food2
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9001"
    spec:
      initContainers:
      - name: wait-for-services
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z user-service 8082 && nc -z restaurant-service 8083 && nc -z order-service 8084 && nc -z payment-service 8086; do echo waiting for backend services; sleep 5; done']
      containers:
      - name: api-gateway
        image: jelly1810/cnpm-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
          name: http
        env:
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx384m -XX:+UseG1GC"
        - name: USER_SERVICE_URL
          value: "http://user-service:8082"
        - name: RESTAURANT_SERVICE_URL
          value: "http://restaurant-service:8083"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8084"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8086"
        - name: SPRING_AUTOCONFIGURE_EXCLUDE
          value: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,prometheus"
        - name: SPRING_CLOUD_GATEWAY_GLOBALCORS_ADD-TO-SIMPLE-URL-HANDLER-MAPPING
          value: "true"
        - name: ALLOWED_ORIGINS
          value: "http://localhost,http://localhost:4300,http://localhost:80"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 9001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9001
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cnpm-food2
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "9001"
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: http
  selector:
    app: api-gateway

